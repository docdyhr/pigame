# Vendored third-party agent skills stay byte-identical to upstream (see .claude/skills/README.md)
exclude: '^\.claude/skills/(?!README\.md$)'

repos:
  - repo: local
    hooks:
      - id: unified-linting
        name: Unified Linting
        entry: ./scripts/lint.sh
        language: system
        pass_filenames: false
        always_run: true
